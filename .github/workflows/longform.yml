name: WealthByte Long-Form YouTube Videos

on:
  schedule:
    - cron: '0 17 * * 5'   # Fridays 1pm ET (17:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu
          mkdir -p /home/runner/.fonts
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Bold.ttf" \
            -O /home/runner/.fonts/Montserrat-Bold.ttf || echo "Font download failed"
          fc-cache -f

      - name: Install Python dependencies
        run: pip install anthropic requests moviepy pillow numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate and post long-form
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python post_longform.py
