name: WealthByte Instagram Posts

on:
  schedule:
    - cron: '0 12 * * *'   # 8am ET
    - cron: '0 15 * * *'   # 11am ET
    - cron: '0 18 * * *'   # 2pm ET
    - cron: '0 21 * * *'   # 5pm ET
    - cron: '0 0 * * *'    # 8pm ET
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write   # allows GITHUB_TOKEN to create/delete releases

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu
          mkdir -p /home/runner/.fonts
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Bold.ttf" \
            -O /home/runner/.fonts/Montserrat-Bold.ttf || echo "Font download failed, using fallback"
          fc-cache -f

      - name: Install dependencies
        run: pip install anthropic requests moviepy pillow numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib


      - name: Run post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python post.py

      - name: Commit updated quote index
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote_index.txt || true
          git diff --staged --quiet || git commit -m "Advance quote index [skip ci]"
          git pull --rebase origin main || true
          git push || echo "Push failed — next run will retry"
