name: WealthByte Instagram Posts

on:
  schedule:
    - cron: '0 12 * * *'   # 8am ET
    - cron: '0 15 * * *'   # 11am ET
    - cron: '0 18 * * *'   # 2pm ET
    - cron: '0 21 * * *'   # 5pm ET
    - cron: '0 0 * * *'    # 8pm ET
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write   # allows GITHUB_TOKEN to create/delete releases

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install dependencies
        run: pip install anthropic requests moviepy pillow numpy

      - name: Download background music
        run: |
          TRACKS=(
            "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Satin/Kai_Engel_-_07_-_Porcelain.mp3"
            "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Tours/Enthusiast/Tours_-_01_-_Enthusiast.mp3"
            "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Satin/Kai_Engel_-_05_-_Intermezzo.mp3"
            "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Broke_For_Free/Directionless_EP/Broke_For_Free_-_01_-_Night_Owl.mp3"
            "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Satin/Kai_Engel_-_01_-_Satin.mp3"
          )
          IDX=$((RANDOM % ${#TRACKS[@]}))
          echo "Downloading track $IDX..."
          curl -sL "${TRACKS[$IDX]}" -o music.mp3 --max-time 60
          ls -lh music.mp3

      - name: Run post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post.py
