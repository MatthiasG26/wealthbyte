name: WealthByte Instagram Posts

on:
  schedule:
    - cron: '0 12 * * *'   # 8am ET
    - cron: '0 15 * * *'   # 11am ET
    - cron: '0 18 * * *'   # 2pm ET
    - cron: '0 21 * * *'   # 5pm ET
    - cron: '0 0 * * *'    # 8pm ET
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write   # allows GITHUB_TOKEN to create/delete releases

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu
          curl -fL "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat-Bold.ttf" \
            -o /usr/local/share/fonts/Montserrat-Bold.ttf
          fc-cache -f

      - name: Install dependencies
        run: pip install anthropic requests moviepy pillow numpy


      - name: Run post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post.py
